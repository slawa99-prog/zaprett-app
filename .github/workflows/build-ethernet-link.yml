name: Build Ethernet Link APK

on:
  push:
    branches:
      - ethernet-link-build
    paths:
      - 'ethernet-link/**'
      - '.github/workflows/build-ethernet-link.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /tmp/android-sdk
      ANDROID_HOME: /tmp/android-sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android command line tools
        run: |
          mkdir -p /tmp/android-sdk/cmdline-tools
          curl -L --retry 3 -o /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline-tools.zip -d /tmp/android-sdk/cmdline-tools
          mv /tmp/android-sdk/cmdline-tools/cmdline-tools /tmp/android-sdk/cmdline-tools/latest
          yes | /tmp/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          /tmp/android-sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Build debug APK
        working-directory: ethernet-link
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp ethernet-link/app/build/outputs/apk/debug/app-debug.apk EthernetLink-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: EthernetLink-APK
          path: EthernetLink-debug.apk
