name: Pocket TV signing tools
on:
  push:
    branches: [feature/pocket-tv]
    paths: [.github/workflows/pocket-signing-tools.yml]
permissions:
  contents: read
jobs:
  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: android-actions/setup-android@v4
      - run: |
          sdkmanager 'build-tools;36.0.0'
          mkdir -p signing-tools
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" signing-tools/
      - uses: actions/upload-artifact@v4
        with:
          name: pocket-signing-tools
          path: signing-tools/apksigner.jar
          if-no-files-found: error
