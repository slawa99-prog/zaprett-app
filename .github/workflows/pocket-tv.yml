name: Pocket TV APK
on:
  push:
    branches: [feature/pocket-tv]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  curl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64, x86]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: native-cache
        with:
          path: |
            pocket-tv/src/main/jniLibs/${{ matrix.abi }}
            pocket-tv/src/main/assets/licenses
            pocket-tv/build/reports/native
          key: pocket-curl-${{ matrix.abi }}-${{ hashFiles('pocket-tv/scripts/build-curl.sh') }}
      - uses: android-actions/setup-android@v4
        if: steps.native-cache.outputs.cache-hit != 'true'
      - name: Build self-contained Android curl
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: |
          sdkmanager 'ndk;27.2.12479018'
          bash pocket-tv/scripts/build-curl.sh '${{ matrix.abi }}'
      - uses: actions/upload-artifact@v4
        with:
          name: pocket-curl-${{ matrix.abi }}
          path: |
            pocket-tv/src/main/jniLibs/${{ matrix.abi }}
            pocket-tv/src/main/assets/licenses
          if-no-files-found: error
  build:
    needs: curl
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: pocket-curl-*
          path: pocket-tv/src/main
          merge-multiple: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v4
      - name: Verify root bridge lifecycle
        run: sudo python3 pocket-tv/tests/test_bridge.py
      - name: Unit tests and APK
        working-directory: pocket-tv
        run: ../gradlew testDebugUnitTest assembleDebug assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test remote navigation on Android 14
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_c
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            python3 pocket-tv/tests/test_android_runtime.py
            bash pocket-tv/tests/run_device_tests.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pocket-tv-test2
          path: |
            pocket-tv/build/outputs/apk/debug/*.apk
            pocket-tv/build/reports/
            pocket-tv/screenshots/
