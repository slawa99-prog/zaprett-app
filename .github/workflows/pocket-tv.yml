name: Pocket TV APK
on:
  push:
    branches: [feature/pocket-tv]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v4
      - name: Preserve test signing key for subsequent builds
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: pocket-tv-debug-signing-v1
      - name: Verify root bridge lifecycle
        run: sudo python3 pocket-tv/tests/test_bridge.py
      - name: Unit tests and APK
        working-directory: pocket-tv
        run: ../gradlew testDebugUnitTest assembleDebug assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test remote navigation on Android 14
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_c
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash pocket-tv/tests/run_device_tests.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pocket-tv-test1
          path: |
            pocket-tv/build/outputs/apk/debug/*.apk
            pocket-tv/build/reports/
            pocket-tv/screenshots/
