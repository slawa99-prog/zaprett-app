plugins {
    id 'com.android.application'
}

android {
    namespace 'com.slawa.ethernetlink'
    compileSdk 35
    ndkVersion '27.2.12479018'

    defaultConfig {
        // v1 used an ephemeral CI debug key. Keep it installed during v2 testing.
        applicationId 'com.slawa.ethernetlink.v2'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '2.0-test2'

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }
}
