plugins {
    id 'com.android.application'
}

android {
    namespace 'com.slawa.ethernetlink'
    compileSdk 35
    ndkVersion '27.2.12479018'

    defaultConfig {
        // v1 used an ephemeral CI debug key. Keep it installed during v2 testing.
        applicationId 'com.slawa.ethernetlink.v2'
        minSdk 26
        targetSdk 35
        versionCode 7
        versionName '2.3-test1'

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            minifyEnabled false
        }
    }

    buildFeatures { buildConfig true }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
